apiVersion: v1
kind: ConfigMap
metadata:
  name: mq-diag-agent-config
  namespace: cp4i
data:
  IBMMQ_QUEUE_MANAGER: "QMGRNHA"
  IBMMQ_CHANNEL: "MQAGENT.SVRCONN"
  MCP_CURRENT_USER_ID: "admin"
  IBMMQ_HOST: "qmgrnha-ibm-mq.cp4i.svc.cluster.local"
  IBMMQ_PORT: "1414"
  IBMMQ_USE_SSL: "false"
  IBMMQ_CONNECTION_TIMEOUT: "30"
  IBMMQ_MAX_RETRIES: "3"
  MCP_SERVER_NAME: "mq-diag-agent"
  MCP_SERVER_VERSION: "1.0.0"
  MCP_CURRENT_USER_ID: "admin"
  MCP_LOG_LEVEL: "INFO"
  DEADQ_NAME: "DEV.DEAD.LETTER.QUEUE"
  POLL_INTERVAL: "5"
  MQ_CONNECT_TYPE: "CLIENT"
  MQ_DATA_PATH: "/tmp/mqm"
---
apiVersion: v1
kind: Secret
metadata:
  name: mq-diag-agent-secret
  namespace: cp4i
type: Opaque
stringData:
  WATSONX_API_KEY: "Yn9t5yZt_mAW9WHDrA5vMihLuTJhtKpMxNmFfA8up-OU"
  WATSONX_PROJECT_ID: "7d04b451-bcc1-4f1f-a4a4-77d2ba645c09"
  WATSONX_URL: "https://us-south.ml.cloud.ibm.com"
  WATSONX_MODEL_ID: "meta-llama/llama-3-3-70b-instruct"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mq-diag-agent
  namespace: cp4i
  labels:
    app: mq-diag-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mq-diag-agent
  template:
    metadata:
      labels:
        app: mq-diag-agent
    spec:
      initContainers:
      - name: wait-for-mq
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z qmgrnha-ibm-mq.cp4i.svc.cluster.local 1414; do echo waiting for MQ; sleep 5; done; echo MQ ready"]
      containers:
      - name: mq-diag-agent
        image: austinsd/mq-diag-agent:v9
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: mq-diag-agent-config
        - secretRef:
            name: mq-diag-agent-secret
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mq-diag-agent
  namespace: cp4i
  labels:
    app: mq-diag-agent
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: mq-diag-agent
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mq-diag-agent
  namespace: cp4i
  labels:
    app: mq-diag-agent
spec:
  to:
    kind: Service
    name: mq-diag-agent
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

