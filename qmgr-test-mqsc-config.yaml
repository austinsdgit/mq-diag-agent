apiVersion: v1
kind: ConfigMap
metadata:
  name: qmgr-test-mqsc-config
  namespace: mq-diag-agent
data:
  setup.mqsc: |
    * Create mqagent channel for diagnostic agent
    DEFINE CHANNEL(MQAGENT.SVRCONN) CHLTYPE(SVRCONN) TRPTYPE(TCP) MCAUSER('mqagent') REPLACE
    ALTER AUTHINFO(SYSTEM.DEFAULT.AUTHINFO.IDPWOS) AUTHTYPE(IDPWOS) CHCKCLNT(OPTIONAL)
    REFRESH SECURITY TYPE(CONNAUTH)
    
    * Create DEADQ for testing
    DEFINE QLOCAL(DEADQ) USAGE(NORMAL) REPLACE
    ALTER QMGR DEADQ(DEADQ)
    
    * Create test queues
    DEFINE QLOCAL(TEST.LOCAL.QUEUE) REPLACE
    DEFINE QLOCAL(TEST.XMIT.QUEUE) USAGE(XMITQ) TRIGGER TRIGTYPE(FIRST) INITQ(SYSTEM.CHANNEL.INITQ) TRIGDATA(TEST.TO.REMOTE) REPLACE
    
    * Create sender channel to non-existent QMGR (will cause messages to go to DEADQ)
    DEFINE CHANNEL(TEST.TO.REMOTE) CHLTYPE(SDR) CONNAME('nonexistent.host(1414)') XMITQ(TEST.XMIT.QUEUE) REPLACE
    
    * Create remote queue definition pointing to non-existent target
    DEFINE QREMOTE(TEST.REMOTE.QUEUE) RNAME('TARGET.QUEUE') RQMNAME('REMOTEQM') XMITQ(TEST.XMIT.QUEUE) REPLACE
    
    * Grant permissions to mqagent user
    SET AUTHREC OBJTYPE(QMGR) PRINCIPAL('mqagent') AUTHADD(CONNECT,INQ,ALTUSR)
    SET AUTHREC PROFILE(DEADQ) OBJTYPE(QUEUE) PRINCIPAL('mqagent') AUTHADD(PUT,GET,BROWSE,INQ,DSP)
    SET AUTHREC PROFILE(TEST.**) OBJTYPE(QUEUE) PRINCIPAL('mqagent') AUTHADD(PUT,GET,BROWSE,INQ,DSP)
    SET AUTHREC PROFILE(SYSTEM.DEAD.LETTER.QUEUE) OBJTYPE(QUEUE) PRINCIPAL('mqagent') AUTHADD(PUT,GET,BROWSE,INQ,DSP)
    SET AUTHREC PROFILE(MQAGENT.**) OBJTYPE(CHANNEL) PRINCIPAL('mqagent') AUTHADD(DSP,CTRL)
    SET AUTHREC PROFILE(TEST.**) OBJTYPE(CHANNEL) PRINCIPAL('mqagent') AUTHADD(DSP,CTRL)
    
    * Display configuration
    DISPLAY QLOCAL(DEADQ)
    DISPLAY QLOCAL(TEST.*)
    DISPLAY QREMOTE(TEST.*)
    DISPLAY CHANNEL(MQAGENT.SVRCONN)
    DISPLAY CHANNEL(TEST.TO.REMOTE)

