apiVersion: mq.ibm.com/v1beta1
kind: QueueManager
metadata:
  name: qmgrtest
  namespace: mq-diag-agent
spec:
  license:
    accept: true
    license: L-VTPK-22YZPK
    use: Production
  queueManager:
    name: QMGRTEST
    availability:
      type: SingleInstance
    storage:
      queueManager:
        type: persistent-claim
        size: 2Gi
        class: ocs-storagecluster-ceph-rbd
    mqsc:
      - configMap:
          name: qmgr-test-mqsc-config
          items:
            - setup.mqsc
  version: 9.3.5.1-r1
  web:
    enabled: true
  pki:
    keys:
      - name: default
        secret:
          secretName: qmgrtest-cert
          items:
            - tls.key
            - tls.crt

